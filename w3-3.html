<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สูตร</title>
</head>
<body>
    <h1>สูตรคำนวณ</h1>
    <script>
        var num = prompt("กรุณาป้อนเลข")
        for (i = 1; i <= 12; i++) {
        var total = num * i;
        document.write(num + '*' + i + '=' + total + '<br>');
}
</script>
</body>
</html>
